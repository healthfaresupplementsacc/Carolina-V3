<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthFare — Admin</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <header id="hdr" class="hidden">
    <span>🛠️ HealthFare Admin</span>
    <nav>
      <button id="tab-ops" class="tab active">👷 Operadores</button>
      <button id="tab-notifs" class="tab">🔔 Notificações <span id="notif-badge" class="badge hidden">0</span></button>
      <button id="tab-analytics" class="tab">📊 Analytics</button>
    </nav>
    <button id="btn-logout" class="btn-sm">Sair</button>
  </header>

  <main>
    <section id="view-login" class="view">
      <h1>🛠️ Admin</h1>
      <input id="pw" type="password" placeholder="Senha do painel" autocomplete="current-password">
      <button id="btn-login" class="btn-big btn-primary">Entrar</button>
      <div id="login-err" class="err"></div>
    </section>

    <section id="view-ops" class="view hidden">
      <div id="ops-list" class="cards"></div>
    </section>

    <section id="view-op-edit" class="view hidden">
      <button id="btn-back" class="btn-sm">← Voltar</button>
      <div id="op-edit"></div>
    </section>

    <section id="view-analytics" class="view hidden">
      <div class="filters">
        <select id="a-range"><option value="7d">Últimos 7 dias</option><option value="30d">30 dias</option><option value="90d">90 dias</option></select>
      </div>
      <div id="a-cards" class="metric-cards"></div>
      <div class="chart-box"><canvas id="chart-bottles"></canvas></div>
      <div class="chart-box"><canvas id="chart-ops"></canvas></div>
      <div class="chart-box"><canvas id="chart-slugs"></canvas></div>
      <div id="a-table"></div>
    </section>

    <section id="view-notifs" class="view hidden">
      <div class="filters">
        <select id="f-status"><option value="pending">Pendentes</option><option value="all">Todas</option></select>
        <select id="f-type">
          <option value="all">Todos os tipos</option>
          <option value="slack_event_not_on_page">🔔 Slack órfão</option>
          <option value="unfilled_bottle_count">📊 Bottle count</option>
          <option value="dead_letter">⚠️ Dead-letter</option>
        </select>
      </div>
      <div id="notifs-list" class="cards"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/admin/app.js"></script>
</body>
</html>
