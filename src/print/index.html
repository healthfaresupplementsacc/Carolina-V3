<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c92">
  <title>HealthFare — Estação de Impressão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/hf-design.css">
  <link rel="stylesheet" href="/op/style.css">
  <link rel="icon" href="/op/assets/healthfare-logo.png">
  <style>
    /* fundo idêntico ao /op: blobs de gradiente cobrindo a viewport + centralizador */
    #pstage { position:fixed; inset:0; overflow:hidden; background:#eef4fb; }
    #pambient { position:absolute; inset:0; pointer-events:none; }
    #pcenter { position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    @keyframes hfShake { 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(5px)} 50%{transform:translateX(-7px)} }
    button { font-family:inherit; }
  </style>
</head>
<body>
  <div id="pstage">
    <div id="pambient"></div>
    <div id="pcenter"></div>
  </div>
  <!-- token da página (Bearer) — as rotas /api/v3/op/* exigem ele. Mesmo do /op. -->
  <script src="/op/config.js"></script>
  <!-- Code128 + QR vendorados: a etiqueta pedida pelo celular sai deste PC -->
  <script src="/op/vendor/code128.js"></script>
  <script src="/op/vendor/qrcode.min.js"></script>
  <!-- desenho ÚNICO da etiqueta 4x6 + fila de impressão pedida pelo celular -->
  <script src="/shared/label-sheet.js"></script>
  <script src="/shared/print-queue-card.js"></script>
  <script src="/print/print.js"></script>
</body>
</html>
