<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c92">
  <title>HealthFare — Linha de Produção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/hf-design.css">
  <link rel="stylesheet" href="/op/style.css">
  <link rel="manifest" href="/op/manifest.json">
  <link rel="apple-touch-icon" href="/op/assets/healthfare-logo.png">
  <link rel="icon" href="/op/assets/healthfare-logo.png">
</head>
<body>
  <!-- REGRA #0: o sistema NUNCA bloqueia o operador. Não há mais "gire o aparelho":
       em celular vertical o layout reflui (ver style.css .hf-portrait + fitCanvas). -->

  <!-- palco ocupa a viewport; o AMBIENTE (blobs+bottles+cápsulas) cobre 100% da
       viewport (z0) pra NUNCA cortar em telas de aspect ratio diferente; o canvas
       é o design 1440x900 escalado (transparente, z1) por cima. app.js preenche os dois. -->
  <div id="hf-stage">
    <div id="hf-ambient"></div>
    <div id="hf-canvas"></div>
  </div>

  <!-- dados estáticos + módulos (reaproveitados do app atual) -->
  <script src="/op/config.js"></script>
  <script src="/op/fuse-data.js"></script>
  <script src="/op/state-machine.js"></script>
  <script src="/op/offline-queue.js"></script>
  <script src="/shared/hf-design.js"></script>
  <!-- Code128 + QR vendorados (sem CDN): a etiqueta de caixa sai daqui também,
       igual à do hub de estoque. -->
  <script src="/op/vendor/code128.js"></script>
  <script src="/op/vendor/qrcode.min.js"></script>
  <!-- desenho ÚNICO da etiqueta 4x6 (Central, hub de estoque, /print e a fila
       de impressão pedida pelo celular) -->
  <script src="/shared/label-sheet.js"></script>
  <!-- fila de impressão pedida pelo celular: mesma peça nas 3 telas com papel -->
  <script src="/shared/print-queue-card.js"></script>
  <!-- Menu persistente do operador (Linha · Central de P&P · Estoque) -->
  <script src="/op/nav.js"></script>
  <!-- Central de P&P & Estoque (workspace) — define window.HF_WS antes do app -->
  <script src="/op/ws.js"></script>
  <!-- Pausa: banner + "Você estava nisso desde o começo?" — define window.HF_PAUSE antes do app -->
  <script src="/op/pause-ui.js"></script>
  <script src="/op/app.js"></script>
  <script>
    // Service worker (network-first) + AUTO-UPDATE de verdade: a página fica
    // aberta o dia todo, então (1) checamos por SW novo a cada 60s e (2) quando
    // um SW novo assume o controle, RECARREGAMOS — antes só atualizava se
    // fechasse o app inteiro. Guard hadController evita reload na 1ª instalação.
    if ('serviceWorker' in navigator) {
      var _hadController = !!navigator.serviceWorker.controller;
      var _reloaded = false;
      function _swReload() { if (_reloaded) return; _reloaded = true; location.reload(); }
      navigator.serviceWorker.register('/op/sw.js').then(function (reg) {
        setInterval(function () { try { reg.update(); } catch (e) {} }, 60000);
      }).catch(function () {});
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data === 'sw-updated' && _hadController) _swReload();
      });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_hadController) _swReload();
      });
    }
  </script>
</body>
</html>
