<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c92">
  <title>HealthFare — Linha de Produção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/hf-design.css">
  <link rel="stylesheet" href="/op/style.css">
  <link rel="manifest" href="/op/manifest.json">
  <link rel="apple-touch-icon" href="/op/assets/healthfare-logo.png">
  <link rel="icon" href="/op/assets/healthfare-logo.png">
</head>
<body>
  <!-- aviso de girar (portrait em tela pequena) — fallback do orientation:landscape -->
  <div id="hf-rotate-prompt" style="display:none">
    <div class="rotate-content">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
      <div class="rotate-text">Gire o dispositivo<br>para horizontal</div>
    </div>
  </div>

  <!-- palco ocupa a viewport; o AMBIENTE (blobs+bottles+cápsulas) cobre 100% da
       viewport (z0) pra NUNCA cortar em telas de aspect ratio diferente; o canvas
       é o design 1440x900 escalado (transparente, z1) por cima. app.js preenche os dois. -->
  <div id="hf-stage">
    <div id="hf-ambient"></div>
    <div id="hf-canvas"></div>
  </div>

  <!-- dados estáticos + módulos (reaproveitados do app atual) -->
  <script src="/op/config.js"></script>
  <script src="/op/fuse-data.js"></script>
  <script src="/op/state-machine.js"></script>
  <script src="/op/offline-queue.js"></script>
  <script src="/shared/hf-design.js"></script>
  <script src="/op/app.js"></script>
  <script>
    // registra o service worker v4 (network-first + reload em update)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/op/sw.js').catch(function () {});
      var _reloaded = false;
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data === 'sw-updated' && !_reloaded) { _reloaded = true; /* próxima navegação já pega o novo */ }
      });
    }
  </script>
</body>
</html>
